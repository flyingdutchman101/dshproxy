<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSHProxy · Routing workspaces</title><style>*{box-sizing:border-box}body{margin:0;background:#02101a;color:#f5fcfb;font:16px/1.5 'Segoe UI',sans-serif;color-scheme:dark}main{max-width:1130px;margin:auto;padding:32px}header,.bar,.row,footer{display:flex;align-items:center;justify-content:space-between;gap:16px}header{border-bottom:1px solid #34505a;padding-bottom:18px}header b{font-size:23px}small,p,.muted{color:#b5cbcf}small{font-size:14px}.bar{margin:28px 0 20px;justify-content:flex-start}.switch{display:flex;background:#061824;padding:4px;border:1px solid #54717a;border-radius:24px}.switch button,nav button{background:transparent;border:0}.switch button{min-width:105px}.switch .on{background:#e9c487;color:#132027}button,select{color:inherit;background:#103340;border:1px solid #53747d;border-radius:18px;padding:8px 16px;cursor:pointer;font:600 15px 'Segoe UI',sans-serif}select{border-radius:6px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f4cf87;outline-offset:2px}nav{display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid #36515a}nav button{border-radius:0;color:#b5cbcf;padding:11px 16px}nav .on{color:#f4cf87;border-bottom:3px solid}.crumb{margin:26px 0 4px;color:#b7cbd0;font-size:14px}h1{font-size:34px;margin:0;letter-spacing:-1px}p{margin:5px 0 20px}.panel{border:1px solid #375561;border-radius:10px;background:#0a2230;overflow:hidden}.row{min-height:70px;padding:14px 20px;border-top:1px solid #2d4752;flex-wrap:wrap}.row:first-child{border:0}.row small{display:block}.tag{color:#a7e0d2;font-size:14px}.primary{background:#e9c487;color:#18242a;border-color:#e9c487}footer{margin-top:22px;flex-wrap:wrap}input{accent-color:#e9c487;width:18px;height:18px;vertical-align:middle}#notice{color:#f4cf87}dialog{max-width:min(540px,90vw);border:1px solid #66808a;background:#0a2230;color:#fff;border-radius:10px;padding:24px}dialog::backdrop{background:#001018ba}dialog label{display:block;margin:14px 0}.detail{margin:10px 0;color:#bfd2d5} @media(max-width:650px){main{padding:14px}header b{font-size:20px}.bar{gap:8px;flex-wrap:wrap}.switch button{min-width:80px}nav button{font-size:14px;padding:8px}.row{gap:8px;padding:12px}h1{font-size:28px}.row>div{min-width:65%}}</style><main><header><b>DSHProxy</b><small>Offline design preview</small></header><div class="bar"><b>Configuration workspace</b><div class="switch" id="modes"></div></div><nav id="nav" aria-label="Settings sections"></nav><div class="crumb" id="crumb"></div><h1 id="title"></h1><p id="sub"></p><div id="body" class="panel"></div><footer><small>Sample configuration · changes last until you reload</small><button id="next" class="primary"></button></footer><p id="notice" role="status"></p></main><dialog id="dlg"><form method="dialog"><h2 id="dt"></h2><div id="dc"></div><button value="cancel">Cancel</button> <button value="ok" class="primary" id="ok">Save preview</button></form></dialog><script>const $=id=>document.getElementById(id),names=['Accounts','API keys','Lanes','Models','DeepSeek Harness','Log'];let mode='Video',tab='Lanes',preset='Balanced',edit=null;const lists={Chat:['Claude','Codex','Kimi'],Video:['Wan 3.0','Hailuo 3','Seedance 2.0','Seedance 2.5']},active={Chat:[true,true,false],Video:[true,true,false,false]},routes=['Krea workspace','Callirra','VideoRouter','VideoRouter'],chats=['Claude → Codex','Codex → Kimi'],billing={'Krea workspace':'Workspace compute units',Callirra:'Plan credits',VideoRouter:'US dollars'};const btn=(s,a)=>`<button data-act="${a}">${s}</button>`,row=(left,right='')=>`<div class="row"><div>${left}</div>${right}</div>`,text=(a,b)=>`<b>${a}</b><small>${b}</small>`;function draw(){const v=mode==='Video',enabled=lists[mode].filter((_,i)=>active[mode][i]);$('modes').innerHTML=['Chat','Video'].map(x=>`<button aria-pressed="${mode===x}" class="${mode===x?'on':''}" data-mode="${x}">${x}</button>`).join('');$('nav').innerHTML=names.map(x=>`<button aria-current="${tab===x?'page':'false'}" class="${tab===x?'on':''}" data-tab="${x}">${x}</button>`).join('');$('crumb').textContent=mode+' workspace  /  '+tab;$('title').textContent=({Lanes:mode+' lanes',Models:mode+' models'})[tab]||tab;$('notice').textContent='';let h='',s='';if(tab==='Lanes'){s=v?'Choose one billing route per enabled model. A paid job never falls through to another provider.':'Choose a routing preset. Each lane tries its ladder from first to last.';if(v){h=lists.Video.map((x,i)=>active.Video[i]?row(text(x,routes[i]+' · '+billing[routes[i]]),btn('Edit route','route'+i)):'').join('')||row('No models enabled. Choose models to configure a video lane.')}else{h=row('Routing preset',`<select aria-label="Routing preset" id="preset">${['Max performance','Balanced','Cheap production'].map(x=>`<option ${x===preset?'selected':''}>${x}</option>`)}</select>`)+chats.map((x,i)=>row(text(['Architect','Scout'][i],'First to last'),btn(x,'ladder'+i))).join('')}}if(tab==='Models'){s=v?'Tick the models to offer in the Harness video action. Choose their billing routes under Lanes.':'Tick the models to offer in the Harness chat picker.';h=lists[mode].map((x,i)=>row(`<label><input type="checkbox" data-i="${i}" ${active[mode][i]?'checked':''}> ${x}</label>`,`<small>${v?(i===1?'768p':'720p')+' · 5 seconds':'Chat model'}</small>`)).join('')}if(tab==='Accounts'||tab==='API keys'){s='Shared credential store, filtered to services used in this workspace. No credentials are requested by this mock.';const arr=tab==='Accounts'?(v?['Krea workspace']:['Claude','Codex']):(v?['VideoRouter','Callirra']:['Custom endpoint']);h=arr.map((x,i)=>row(text(x,'Example connection'),`<span class="tag">${!i&&v?'Not connected':'Configured · demo'}</span>`)).join('')}if(tab==='DeepSeek Harness'){s='Preview what this workspace contributes before applying configuration.';h=row(text(v?'Generate video action':'Chat model picker',enabled.join(', ')||'No enabled models'),btn('Preview changes','preview'))}if(tab==='Log'){s='Workspace events only. Prompts and credentials do not appear here.';h=row(text('No recorded events','This prototype does not run a gateway.'))}$('sub').textContent=s;$('body').innerHTML=h;$('next').textContent=tab==='Lanes'?'Choose models':tab==='Models'?'Review in Harness':tab==='DeepSeek Harness'?'Back to lanes':'View lanes'}function dialog(title,html,kind,label){edit=kind;$('dt').textContent=title;$('dc').innerHTML=html;$('ok').textContent=label||'Save preview';$('dlg').returnValue='';$('dlg').showModal()}document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const {mode:m,tab:t,act:a}=b.dataset;if(m||t){mode=m||mode;tab=t||tab;draw();(m?document.querySelector('.switch .on'):document.querySelector('nav .on')).focus()}if(b.id==='next'){tab=tab==='Lanes'?'Models':tab==='Models'?'DeepSeek Harness':'Lanes';draw()}if(a?.startsWith('route')){const i=+a.slice(5),arr=['Krea workspace','VideoRouter',...(i===1?['Callirra']:[])];dialog(lists.Video[i]+' billing route',`<label>Charge to <select id="choice">${arr.map(x=>`<option ${x===routes[i]?'selected':''}>${x}</option>`).join('')}</select></label><p>One route per job. Harness will show the quote before asking you to approve.</p>`,a)}if(a?.startsWith('ladder')){const i=+a.slice(6),opts=[chats[i],chats[i].split(' → ').reverse().join(' → ')];dialog('Chat lane order',`<label>Try first to last <select id="choice">${opts.map(x=>`<option>${x}</option>`).join('')}</select></label>`,a)}if(a==='preview')dialog('Harness configuration preview',lists[mode].filter((_,i)=>active[mode][i]).map(x=>`<div class="detail">${x} · ${mode==='Video'?routes[lists.Video.indexOf(x)]:'chat picker'}</div>`).join('')||'No enabled models.',a,'Simulate apply')};document.onchange=e=>{if(e.target.dataset.i!==undefined){active[mode][+e.target.dataset.i]=e.target.checked;$('notice').textContent='Model selection updated in this mock.'}if(e.target.id==='preset'){preset=e.target.value;chats[0]=preset==='Cheap production'?'Kimi → Codex':'Claude → Codex';chats[1]=preset==='Max performance'?'Claude → Kimi':'Codex → Kimi';draw()}};$('dlg').onclose=()=>{if($('dlg').returnValue!=='ok')return;if(edit.startsWith('route'))routes[+edit.slice(5)]=$('choice').value;if(edit.startsWith('ladder'))chats[+edit.slice(6)]=$('choice').value;draw();$('notice').textContent=edit==='preview'?'Simulated apply complete. No Harness profile was changed.':'Saved in this preview only.'};draw()</script></html>
