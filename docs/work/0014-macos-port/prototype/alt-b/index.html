<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DeepSeekProxy (prototype)</title>
<!-- Prototype of option (a): the DSHProxy window as a local web page served on 127.0.0.1.
     Self-contained: inline CSS and JS, no external requests (see the CSP above), synthetic in-memory data only.
     Logos are read from logos/ (LobeHub Icons, MIT; notice in logos/SOURCE.md); a lettered badge replaces any that is missing. -->
<style>
:root{
  --page:#02101A; --card:#0A2230; --input:#061824; --log:#04121C;
  --text:#F5FCFB; --muted:#B4CCD4; --faint:#86A0AA;
  --accent:#E4B26A; --accent-hover:#F3CB8B; --accent-deep:#B8873F; --ink:#1E1403; --dim:#15303E;
  --teal:#57D9C9; --ok:#5BDCA8; --warn:#F2C14E; --bad:#F27C6C; --bad-dim:#3A1A18; --bad-fill:#B9473A;
  --glass:rgba(4,22,29,.62);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,0) 80px);
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#061A24,#020B11) fixed;color:var(--text);font-size:13.5px;line-height:1.42;overflow:hidden;display:flex;flex-direction:column}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary:focus-visible,.seg button[aria-checked=true]:focus-visible,.btn[aria-pressed=true]:focus-visible{outline-color:var(--text)}
button{font:inherit}

/* ---------- prototype controls (not part of the design) ---------- */
.proto-bar{position:relative;z-index:3;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:4px 12px;background:repeating-linear-gradient(135deg,#1b1506 0 10px,#221a08 10px 20px);border-bottom:1px dashed #8a6a2f;font-size:12px;color:#F0DCB4;min-height:32px}
.proto-tag{font-weight:700;color:var(--accent)}
.proto-bar select,.proto-bar button{font:inherit;font-size:12px;color:#F0DCB4;background:#2a210c;border:1px dashed #a07c3c;border-radius:6px;padding:2px 8px;min-height:24px}
.proto-bar button{cursor:pointer}
.proto-bar label{display:inline-flex;align-items:center;gap:5px}
.proto-bar input[type=checkbox]{accent-color:var(--accent)}
.btn.proto{border:1px dashed #C89A4A;background:rgba(228,178,106,.08);color:#F0DCB4;font-size:12.5px}
.proto-box{margin-top:14px;padding:8px 10px;border:1px dashed #8a6a2f;border-radius:10px;font-size:12px;color:#F0DCB4;display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* ---------- window ---------- */
.app{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:1240px;margin:0 auto;padding:12px 16px 8px}
.glass{position:relative;background:var(--sheen),var(--glass);-webkit-backdrop-filter:blur(16px) saturate(115%);backdrop-filter:blur(16px) saturate(115%);border-radius:20px}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.09));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:104px;flex-wrap:wrap}
.mark{width:60px;height:60px;flex:none;border-radius:15px;box-shadow:0 0 0 3px rgba(228,178,106,.22),0 0 18px rgba(228,178,106,.18)}
.mark svg{display:block;width:100%;height:100%}
.hdr-main{flex:1 1 300px;min-width:0}
.hdr-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-weight:300;font-size:24px;margin:0;letter-spacing:.2px}
.detail{color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.lowest{font-size:12.5px;margin-top:1px}
.hdr-actions{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 45%,transparent);white-space:nowrap}
.chip.plain{font-weight:500}

/* buttons */
.btn{appearance:none;font-size:13px;min-height:34px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.42);background:rgba(255,255,255,.12);color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:active{background:rgba(255,255,255,.08)}
.btn.primary,.btn[aria-pressed=true]{background:linear-gradient(180deg,#F0C482,var(--accent) 60%);color:var(--ink);font-weight:650;border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(228,178,106,.15)}
.btn.primary:hover{background:linear-gradient(180deg,var(--accent-hover),#EBBD78)}
.btn.primary:active{background:linear-gradient(180deg,var(--accent),var(--accent-deep))}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:rgba(242,124,108,.18)}
.btn.danger-strong{background:var(--bad-fill);color:#fff;font-weight:650;border-color:rgba(255,255,255,.32)}
.btn.danger-strong:hover{background:#C9503F}
.btn.outline{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.05)}
.btn.outline:hover{background:rgba(228,178,106,.14)}
.btn.big{min-width:104px;min-height:40px}
.btn.small{min-height:29px;padding:0 12px;font-size:12.5px}
.btn:disabled,.btn:disabled:hover{background:rgba(255,255,255,.04);color:#6F8791;border-color:rgba(255,255,255,.1);box-shadow:none;cursor:default;font-weight:500}

/* update bar */
.update{display:flex;align-items:center;gap:8px 14px;padding:9px 12px 9px 18px;border-radius:16px;flex-wrap:wrap}
.update p{margin:0;flex:1 1 320px;min-width:0}
.update .btns{display:flex;gap:8px;margin-left:auto}

/* workspace switch + section strip */
.navrow{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.ws{display:flex;align-items:center;gap:10px;min-width:0}
.ws-label{font-weight:700}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:999px}
.seg button{min-width:88px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 14px}
.seg button:hover{background:rgba(255,255,255,.09);color:var(--text)}
.seg button[aria-checked=true]{background:linear-gradient(180deg,var(--accent-hover),var(--accent));color:var(--ink);font-weight:700}
.hint{color:var(--muted);font-size:12.5px;min-width:0}
.strip{display:inline-flex;padding:5px;gap:2px;border-radius:999px;margin-left:auto;flex-wrap:nowrap}
.tab{height:32px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.tab[aria-selected=true]{background:linear-gradient(180deg,rgba(255,255,255,.27),rgba(255,255,255,.13));color:var(--text);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.16)}

/* page */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.page-head{padding:15px 22px 6px}
.page-head h2{margin:0;font-size:17px;font-weight:600}
.note{color:var(--muted);margin:3px 0 0;max-width:120ch;font-size:13px}
.page-body{flex:1;min-height:0;overflow:auto;padding:8px 22px 14px}
.page-body.fill{display:flex;flex-direction:column}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 22px 13px;border-top:1px solid rgba(255,255,255,.08)}
.page-actions .spacer{flex:1}
.status-line{color:var(--muted);font-size:12.5px}
.field{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
select.input,input.input{font:inherit;font-size:13px;color:var(--text);background:var(--input);border:1px solid rgba(255,255,255,.2);border-radius:9px;min-height:32px;padding:0 10px}
input.input{width:100%;padding:6px 10px}
input.input[aria-invalid=true]{border-color:var(--bad)}
select.input:disabled{color:#6F8791}
.banner{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:12px;background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
.banner p{margin:0;flex:1 1 280px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:26px 24px;border-radius:16px;border:1px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.03);max-width:720px}
.empty p{margin:0;font-size:14px}
.empty.state{border-style:solid;border-color:color-mix(in srgb,var(--c) 42%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--text)}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* accounts */
.cards{display:flex;flex-direction:column;gap:12px}
.card{border-radius:16px;padding:13px 16px 14px;background:var(--sheen),rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.26)}
.card.paused{background:rgba(255,255,255,.02)}
.card-top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.card-id{display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap;flex:1 1 320px;min-width:0}
.logo{flex:none;border-radius:6px;object-fit:contain}
.badge{flex:none;display:inline-grid;place-items:center;border-radius:6px;background:var(--dim);color:var(--accent);font-weight:700;border:1px solid rgba(228,178,106,.4)}
.acct-label{font-weight:700;font-size:14.5px}
.email{color:var(--muted)}
.card-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.wins{margin-top:6px}
.win{display:grid;grid-template-columns:minmax(110px,200px) minmax(100px,1fr) minmax(290px,340px);gap:14px;align-items:center;padding-top:7px}
.win-title.muted{color:var(--faint)}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 65%,#ffffff 0%),var(--c));box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.win-text{font-size:12.5px;color:var(--muted)}
.win-text b{color:var(--c);font-weight:700}
.card-note{margin:9px 0 0;color:var(--muted);font-size:12.5px}
.card-note.bad{color:var(--bad)}
.reset-strip{margin-top:12px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 10px 8px 12px;border-radius:12px;background:rgba(242,124,108,.11);border:1px solid rgba(242,124,108,.45)}
.reset-strip p{margin:0;flex:1 1 220px;font-size:12.5px}

/* lists */
table.list{width:100%;border-collapse:separate;border-spacing:0}
.list th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.14);white-space:nowrap;position:sticky;top:-8px;background:#071a24;z-index:1}
.list td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
.list tbody tr:hover td{background:rgba(255,255,255,.035)}
.list tr.sel td{background:rgba(228,178,106,.11)}
.list tr.sel:hover td{background:rgba(228,178,106,.15)}
.cell{display:flex;align-items:center;gap:9px}
.pick{display:flex;align-items:center;gap:9px;cursor:pointer}
.pick input{accent-color:var(--accent);margin:0;width:15px;height:15px}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-muted{color:var(--faint)} .c-brass{color:var(--accent);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* lanes */
.presets{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.presets .lbl{font-weight:700;margin-right:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:10px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.rung{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);font-size:12.5px;white-space:nowrap}
.dot{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#04121C;background:var(--c);flex:none}
.rung.off .nm{color:var(--faint)}
.arrow{color:var(--faint);padding:0 1px}
.lane-name{font-weight:600;white-space:nowrap}

/* switches */
.switch{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;margin:0;border:1px solid rgba(255,255,255,.3);transition:background .15s;flex:none;vertical-align:middle}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#DFE9EC;transition:transform .15s}
.switch:checked{background:var(--ok);border-color:rgba(255,255,255,.35)}
.switch:checked::after{transform:translateX(14px);background:#04121C}
.suggest{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:9px 12px;border-radius:12px;margin-bottom:10px;background:rgba(228,178,106,.1);border:1px solid rgba(228,178,106,.45)}
.suggest p{margin:0;flex:1 1 300px}

/* log */
pre.log{margin:0;flex:1;min-height:120px;font:12px/1.55 ui-monospace,"SF Mono",Menlo,monospace;background:var(--log);border-radius:12px;padding:10px 12px;white-space:pre;overflow:auto;border:1px solid rgba(255,255,255,.08);color:#D6E6EA}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 1.6s ease-in-out infinite}
.live.off i{background:var(--faint);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}

/* footer */
.foot{display:flex;align-items:center;gap:6px 18px;color:var(--muted);font-size:12px;padding:0 6px;flex-wrap:wrap}
.foot .paths{flex:1 1 400px;min-width:0;overflow-wrap:anywhere}
.foot .check{color:var(--text);font-size:12.5px}

/* dialogs */
dialog.dlg{border:0;padding:0;border-radius:18px;color:var(--text);background:var(--sheen),#0A2230;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.3);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 24px);overflow:auto}
dialog.dlg.wide{width:min(560px,calc(100vw - 32px))}
dialog.dlg.danger{box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(242,124,108,.55),inset 0 1px 0 rgba(255,255,255,.25)}
dialog.dlg::backdrop{background:rgba(1,8,12,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg-body{padding:20px 22px 6px}
.dlg h2{margin:0 0 8px;font-size:17px;font-weight:600}
.dlg p{margin:0 0 9px}
.dlg-btns{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 22px 18px;flex-wrap:wrap}
.dlg-btns .left{margin-right:auto}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg-text{min-width:0;white-space:pre-line}
.glyph{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.out{font:12px/1.55 ui-monospace,"SF Mono",Menlo,monospace;background:var(--log);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;white-space:pre-wrap;margin:6px 0 10px;max-height:260px;overflow:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.36);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;min-height:72px}
.tile:hover{background:rgba(255,255,255,.13)}
.tile b{display:block;font-size:14px}
.tile span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.marquee{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin:14px 0}
.marquee::after{content:"";position:absolute;top:0;bottom:0;width:35%;border-radius:6px;background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:mq 1.6s linear infinite}
@keyframes mq{from{left:-35%}to{left:100%}}
.code{font:600 28px/1.2 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:3px;color:var(--accent);margin:6px 0 10px}
.ok-head{color:var(--ok)} .bad-head{color:var(--bad)}
.danger-banner{background:rgba(242,124,108,.14);border:1px solid rgba(242,124,108,.6);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.danger-banner b{color:var(--bad);letter-spacing:.5px}
.danger-banner p{margin:4px 0 0}
fieldset{border:0;padding:0;margin:8px 0}
legend{padding:0;margin-bottom:6px;font-weight:600}
.radio{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:10px;cursor:pointer}
.radio:hover{background:rgba(255,255,255,.05)}
.radio input{accent-color:var(--bad);margin:3px 0 0}
.radio small{display:block;color:var(--muted)}
.lbl-block{display:block;font-weight:600;margin:10px 0 5px}
.err{color:var(--bad);font-size:12.5px;margin-top:5px;min-height:1em}
.hintline{color:var(--muted);font-size:12.5px;margin-top:5px}
.setup{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column;gap:10px}
.setup li{display:flex;gap:11px;align-items:flex-start}
.setup .dot{width:20px;height:20px;font-size:11px;margin-top:1px}
.setup small{display:block;color:var(--muted);white-space:pre-line}

/* menu-bar mock */
dialog.mb{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:#EDEDED;overflow:hidden}
dialog.mb::backdrop{background:rgba(0,0,0,.42)}
.mb-bar{height:26px;display:flex;align-items:center;gap:4px;padding:0 10px;background:rgba(28,30,34,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:13px;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.mb-left{margin-right:auto;display:flex;gap:18px;align-items:center;color:#EDEDED}
.mb-left b{font-weight:700}
.mb-glyph{display:inline-flex;align-items:center;height:22px;padding:0 6px;color:#DADADA}
.mb-icon{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;border:0;background:transparent;color:#EDEDED;cursor:pointer}
.mb-icon[aria-expanded=true]{background:rgba(255,255,255,.24)}
.mb-icon svg{width:16px;height:16px}
.mb-menu{position:absolute;top:30px;min-width:250px;padding:5px;border-radius:10px;background:rgba(42,44,48,.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14);font-size:13px}
.mb-item{display:flex;width:100%;align-items:center;gap:6px;height:24px;padding:0 10px 0 6px;border:0;background:transparent;color:#EDEDED;border-radius:5px;text-align:left;cursor:default;font-size:13px}
.mb-item .tick{width:16px;text-align:center;flex:none}
.mb-item .kbd{margin-left:auto;color:#9A9EA4}
.mb-item:hover,.mb-item:focus{background:#2F6FD8;color:#fff;outline:none}
.mb-item:hover .kbd,.mb-item:focus .kbd{color:#E6EEFF}
.mb-item:focus-visible{box-shadow:0 0 0 2px #fff inset}
.mb-sep{height:1px;background:rgba(255,255,255,.14);margin:5px 8px}
.mb-status{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;color:#A6AAB0;font-size:12px}
.mb-status .tick{width:16px;text-align:center}
.mb-caption{position:absolute;left:20px;bottom:20px;max-width:min(460px,calc(100vw - 40px));padding:16px 18px;border-radius:16px;background:rgba(10,34,48,.92);border:1px dashed #a07c3c;color:#F0DCB4;font-size:13px}
.mb-caption p{margin:0 0 10px}

/* toast + quit */
.toast{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:20;padding:9px 16px;border-radius:12px;background:rgba(10,34,48,.95);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:min(620px,calc(100vw - 40px));font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.quit{margin:auto;max-width:520px;text-align:center;padding:28px}
.quit p{color:var(--muted)}

/* short window (height < 760), as in the Windows app */
@media (max-height:760px){
  .app{gap:8px;padding:8px 14px 6px}
  .hdr{min-height:0;padding:9px 16px;gap:12px}
  .mark{width:44px;height:44px;border-radius:11px}
  h1{font-size:18px}
  .detail{margin-top:1px;font-size:12.5px}
  .btn.big{min-height:36px;min-width:92px}
  .hint{display:none}
  .seg button{height:30px;min-width:74px}
  .tab{height:30px;padding:0 12px}
  .page-head{padding:10px 18px 4px}
  .page-head h2{font-size:15.5px}
  .note{font-size:12.5px}
  .page-body{padding:6px 18px 10px}
  .page-actions{padding:8px 18px 10px}
  .update{padding:6px 10px 6px 16px}
  .legend{display:none}
  .proto-bar{min-height:28px;padding:2px 10px}
}
@media (max-width:1060px){ .col-service{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- gateway actions ---------- */
let startTimer = null;
function startGateway() {
  if (S.quit) return;
  if (S.gateway === 'running') { logLine(`A gateway is already running on ${ORIGIN}; showing its status.`); toast('The gateway is already running.'); return; }
  if (S.gateway === 'starting' || S.gateway === 'notanswering') return;
  S.gateway = 'starting'; logLine('Starting the gateway...'); renderAll();
  clearTimeout(startTimer);
  startTimer = setTimeout(() => {
    if (S.gateway !== 'starting') return;
    S.gateway = 'running';
    logLine(`[gateway] DSHProxy listening on ${ORIGIN}`);
    logLine(`[backend] CLIProxyAPI ${S.backend.current} started on 127.0.0.1:8418 (loopback only)`);
    S.limitsAt = Date.now(); renderAll();
  }, 1600);
}
async function confirmCut(quitting) {
  const title = quitting ? 'Quit DeepSeekProxy' : 'Stop gateway';
  const tail = quitting ? 'Quit anyway?' : 'Stop anyway?';
  const cuts = quitting ? 'Quitting stops the gateway now and cuts' : 'Stopping the gateway now cuts';
  if (S.gateway === 'notanswering') {
    return ask(title, `The gateway did not answer when it was last checked, so requests may be in flight.${S.inflight ? ` ${S.inflight} model requests were in flight when it last answered.` : ''} ${cuts} any that are.\n\n${tail}`, { kind: 'warn', danger: true });
  }
  if (S.gateway === 'running' && S.inflight > 0) {
    const n = S.inflight;
    return ask(title, `${n} model ${plural(n, 'request was', 'requests were')} in flight when the gateway was last checked, a few seconds ago at most. ${cuts} ${plural(n, 'it', 'them')}.\n\n${tail}`, { kind: 'warn', danger: true });
  }
  return true;
}
let stopAsking = false;
async function stopGateway() {
  if (S.gateway === 'stopped' || stopAsking) return;
  stopAsking = true;
  const ok = await confirmCut(false);
  stopAsking = false;
  if (!ok) return;
  clearTimeout(startTimer);
  S.gateway = 'stopped'; logLine('Gateway stopped.'); renderAll();
}
async function quitApp() {
  if (stopAsking) return;
  stopAsking = true;
  const ok = S.gateway === 'stopped' ? true : await confirmCut(true);
  stopAsking = false;
  if (!ok) return;
  clearTimeout(startTimer);
  S.gateway = 'stopped'; S.quit = true; logLine('Quit: gateway stopped.'); renderAll();
}
function restartGateway(why) {
  S.gateway = 'starting'; logLine(why); renderAll();
  clearTimeout(startTimer);
  startTimer = setTimeout(() => { S.gateway = 'running'; logLine(`[gateway] DSHProxy listening on ${ORIGIN}`); renderAll(); }, 1500);
}
// After a key change: ask, then restart now or at an idle moment.
async function offerRestart(output) {
  if (!running()) { await msgBox('API key', output + '\n\nThe change is used when the gateway starts.', { kind: 'info' }); return; }
  const n = S.inflight;
  const yes = await ask('API key', `${output}\n\nRestart the gateway now so it uses the change?${n ? `\n\n${n} ${plural(n, 'request is', 'requests are')} in flight: the restart waits for a moment with none, at most 5 minutes, and cuts nothing.` : ''}`, { kind: 'info', safeIsYes: true });
  if (!yes) return;
  if (!n) { restartGateway('Restart: nothing in flight. Stopping and starting the gateway.'); return; }
  restartWaitDialog();
}
function restartWaitDialog() {
  let left = S.inflight, timer = null, cancelling = false;
  const text = h('p', { 'aria-live': 'polite' });
  const cancelBtn = h('button', { type: 'button', class: 'btn', 'data-autofocus': true }, 'Cancel');
  const update = () => { text.textContent = left > 0 ? `Waiting for ${left} ${plural(left, 'request', 'requests')} to finish before restarting` : 'Nothing is in flight now. Waiting for the gateway to stop before restarting.'; };
  const api = openDialog({ onCancel: () => doCancel(), build(api) {
    update();
    api.d.append(h('div', { class: 'dlg-body' }, h('h2', { id: api.id + '-t' }, 'Restart gateway'), text, h('div', { class: 'marquee', role: 'progressbar', 'aria-label': 'Waiting for an idle moment' }),
      h('p', { class: 'status-line' }, 'The gateway keeps serving until a moment with nothing in flight, for at most 5 minutes. Cancel leaves it running; the key change is then used after the next restart.')),
      h('div', { class: 'dlg-btns' }, cancelBtn));
  } });
  cancelBtn.addEventListener('click', () => doCancel());
  function doCancel() {
    if (cancelling) return; cancelling = true; clearInterval(timer);
    text.textContent = 'Cancelling the restart...'; cancelBtn.disabled = true;
    setTimeout(() => { api.close(); logLine('Restart cancelled: the gateway keeps running. The key change is used after the next restart.'); }, 700);
  }
  timer = setInterval(() => {
    if (cancelling) return;
    left = Math.max(0, left - 1); update();
    if (left === 0) {
      clearInterval(timer);
      setTimeout(() => { if (cancelling) return; api.close(); S.inflight = 0; $('#pInflight').checked = false; restartGateway('Restart: the gateway stopped at a moment with nothing in flight. Starting it again.'); }, 1100);
    }
  }, 1400);
}

/* ---------- backend update ---------- */
async function updateBackend() {
  const b = S.backend, v = b.latest;
  const yes = await ask('Update CLIProxyAPI', `Update the backend to CLIProxyAPI ${v}?\n\n1. Download it and check it against the release's published checksum.\n2. Start it on a spare port and send one short request through each signed-in account (uses a tiny bit of quota).\n3. Only if that passes: restart DSHProxy on ${v}, about 5 seconds offline.\n\nIf anything fails, DSHProxy stays on the version you have.`);
  if (!yes) return;
  b.busy = true; renderAll();
  await wait(2400);
  const checks = S.accounts.filter(a => !a.disabled).map(a => `• ${a.label} (${a.account}): ${a.provider === 'antigravity' ? 'out of quota, does not count against it' : 'answered'}`);
  b.busy = false; b.previous = b.current; b.current = v; b.available = false;
  logLine(`CLIProxyAPI ${v} passed the trial run; DSHProxy is restarting on it.`);
  restartGateway(`[update] restarting on CLIProxyAPI ${v}`);
  await msgBox('Update CLIProxyAPI', `CLIProxyAPI ${v} passed the trial run.\n\nTrial run:\n${checks.length ? checks.join('\n') : '• No signed-in account: only the start was tried.'}\n\nDSHProxy is restarting on the new version.`, { kind: 'info' });
}
async function rollbackBackend() {
  const b = S.backend;
  const yes = await ask('Roll back', `Go back to CLIProxyAPI ${b.previous}?\n\nDSHProxy restarts, about 5 seconds offline.`);
  if (!yes) return;
  const was = b.current; b.current = b.previous; b.previous = null;
  b.available = $('#pUpdate').checked; b.latest = was;
  restartGateway(`Rolled back to CLIProxyAPI ${b.current}; DSHProxy is restarting.`);
}

    v.route ? null : h('option', { value: '', selected: true }, 'Choose a route'),
    v.routes.map(r => h('option', { value: r, selected: r === v.route }, `${ROUTE_LABEL[r]} · ${r} · billed in ${UNITS[r]}`)));
  const save = h('button', { type: 'button', class: 'btn primary', disabled: !v.route }, 'Save route');
  sel.addEventListener('change', () => { save.disabled = !sel.value; });
  const api = openDialog({ build(api) {
    api.d.append(h('div', { class: 'dlg-body' }, h('h2', { id: api.id + '-t' }, 'Video billing route'),
      h('label', { class: 'lbl-block', for: 'route-sel' }, `Charge ${v.model} to:`), sel,
      h('p', { class: 'status-line', style: 'margin-top:10px' }, 'One route for each model. A paid job is never retried automatically or moved to another route.'),
      h('p', { class: 'status-line' }, 'Saving a route does not check a sign-in, a key or a price, and charges nothing.' + (!v.enabled && !enabling ? ' The model stays switched off.' : ''))),
      h('div', { class: 'dlg-btns' }, h('button', { type: 'button', class: 'btn', onclick: () => api.close() }, 'Cancel'), save));
  } });
  save.addEventListener('click', () => {
    v.route = sel.value; if (enabling) v.enabled = true;
    api.close();
    saveVideo(v, `${v.model} → ${ROUTE_LABEL[v.route]} · ${v.route}${enabling ? ', switched on' : ''}`);
  });
}

const PAGES = { c0: pageAccounts, c1: pageKeys, c2: pageLanes, c3: pageModels, c4: pageHarness, v0: pageVAccounts, v1: pageVKeys, v2: pageVLanes, v3: pageVModels, v4: pageVHarness, log: pageLog };

/* =====================================================================
   Menu-bar item (drawn mock: a web page cannot draw in the real menu bar)
   ===================================================================== */
const TEMPLATE_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.6 10 8H6z" fill="currentColor"/><path d="M8 13.4 10 8H6z" fill="currentColor" opacity=".45"/></svg>';
function openMenuBar() {
  if (document.querySelector('dialog.mb')) return;
  const opener = $('#mbOpen');
  const d = h('dialog', { class: 'mb', 'aria-label': 'Menu bar (mock)' });
  const stateWord = S.quit ? 'not running' : { running: 'running', starting: 'starting', notanswering: 'not answering', stopped: 'stopped' }[S.gateway];
  const item = (label, fn, extra = {}) => h('button', { type: 'button', class: 'mb-item', role: extra.role || 'menuitem', 'aria-checked': extra.checked, tabindex: '-1', onclick: () => { close(); fn(); } },
    h('span', { class: 'tick', 'aria-hidden': 'true' }, extra.tick || ''), label, extra.kbd ? h('span', { class: 'kbd', 'aria-hidden': 'true' }, extra.kbd) : null);
  const now = new Date();
  const icon = h('button', { type: 'button', class: 'mb-icon', 'aria-haspopup': 'menu', 'aria-expanded': 'true', 'aria-label': `DSHProxy: ${stateWord}`, onclick: () => { menu.hidden = !menu.hidden; icon.setAttribute('aria-expanded', String(!menu.hidden)); } });
  icon.innerHTML = TEMPLATE_ICON;
  const menu = h('div', { class: 'mb-menu', role: 'menu', 'aria-label': 'DSHProxy' },
    h('div', { class: 'mb-status', role: 'none' }, h('span', { class: 'tick' }, ''), `DSHProxy: ${stateWord}`),
    h('div', { class: 'mb-sep', role: 'separator' }),
    item('Open DSHProxy', () => { if (S.quit) return; $('.tab[aria-selected=true]').focus(); toast('The DSHProxy window is brought to the front (mocked).'); }),
    item('Add account…', () => { if (S.quit) return; S.workspace = 'chat'; S.section = 0; renderAll(); addAccountFlow(); }),
    h('div', { class: 'mb-sep', role: 'separator' }),
    item('Start gateway', () => { if (S.quit) { S.quit = false; rebuildShell(); renderAll(); } startGateway(); }),
    item('Stop gateway', () => stopGateway()),
    h('div', { class: 'mb-sep', role: 'separator' }),
    item('Start at login', () => setLogin(!S.startAtLogin), { role: 'menuitemcheckbox', checked: String(S.startAtLogin), tick: S.startAtLogin ? '✓' : '' }),
    h('div', { class: 'mb-sep', role: 'separator' }),
    item('Quit', () => quitApp(), { kbd: '⌘Q' }));
  d.append(
    h('div', { class: 'mb-bar' },
      h('div', { class: 'mb-left', 'aria-hidden': 'true' }, h('b', {}, 'Safari'), h('span', {}, 'File'), h('span', {}, 'Edit'), h('span', {}, 'View'), h('span', {}, 'Window'), h('span', {}, 'Help')),
      h('span', { class: 'mb-glyph', 'aria-hidden': 'true' }, '◐'), h('span', { class: 'mb-glyph', 'aria-hidden': 'true' }, '▤'),
      icon,
      h('span', { class: 'mb-glyph', 'aria-hidden': 'true' }, `${DOW[now.getDay()]} ${now.getDate()} ${MON[now.getMonth()]} ${hm(now)}`)),
    menu,
    h('div', { class: 'mb-caption' },
      h('p', {}, h('b', {}, 'Drawn mock of the menu-bar item. '), 'A web page cannot draw in the real macOS menu bar; in option (a) this item is the only native part. It opens the window, starts and stops the gateway, and owns the login item.'),
      h('p', {}, 'Arrow keys move through the menu; Escape closes this mock.'),
      h('button', { type: 'button', class: 'btn proto small', onclick: () => close() }, 'Close mock')));
  function close() { if (d.open) d.close(); }
  d.addEventListener('close', () => { d.remove(); if (!document.querySelector('dialog[open]') && opener.isConnected) opener.focus(); });
  d.addEventListener('keydown', e => {
    const items = [...menu.querySelectorAll('.mb-item')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Tab') trapTab(e, d);
  });
  document.body.append(d);
  d.showModal();
  const r = icon.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(window.innerWidth - 262, r.left - 6)) + 'px';
  menu.querySelector('.mb-item').focus();
}

/* =====================================================================
   Backdrop stars (seed 1846, 150 stars in the top 62%, as in Skin.cs)
   ===================================================================== */
function drawStars() {
  const c = $('#stars'), dpr = window.devicePixelRatio || 1, w = innerWidth, hh = innerHeight;
  c.width = w * dpr; c.height = hh * dpr; c.style.width = w + 'px'; c.style.height = hh + 'px';
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = 'rgba(230,243,242,0.28)';
  let s = 1846; const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 150; i++) { const x = rnd() * w, y = rnd() * hh * 0.62, big = rnd() < 1 / 12; g.fillRect(Math.round(x), Math.round(y), big ? 2 : 1, big ? 2 : 1); }
}

/* =====================================================================
   Wiring
   ===================================================================== */
function applyScenario(scn) {
  clearTimeout(startTimer);
  document.querySelectorAll('dialog[open]').forEach(d => d.close());
  S = initialState(scn);
  seedLog();
  rebuildShell();
  renderAll();
}
$('#scenario').addEventListener('change', e => applyScenario(e.target.value));
$('#pUpdate').addEventListener('change', e => { S.backend.available = e.target.checked; if (e.target.checked && S.backend.latest === S.backend.current) S.backend.latest = '6.7.3'; renderAll(); });
$('#pInflight').addEventListener('change', e => { S.inflight = e.target.checked ? 2 : 0; renderAll(); });
$('#mbOpen').addEventListener('click', openMenuBar);
addEventListener('resize', drawStars);
setInterval(() => { if (S && running() && !S.quit) logLine(LIVE[Math.floor(Math.random() * LIVE.length)]()); }, 2600);
drawStars();
applyScenario('sample');
</script>
