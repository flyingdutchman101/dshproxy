<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSHProxy (prototype)</title>
<!-- Prototype of option (a): the DSHProxy window as a local web page served on 127.0.0.1.
     Self-contained: inline CSS and JS, no external requests, synthetic in-memory data only. -->
<style>
:root{
  --page:#02101A; --card:#0A2230; --input:#061824; --log:#04121C;
  --text:#F5FCFB; --muted:#B4CCD4; --faint:#7E98A2;
  --brass:#E4B26A; --brass-hi:#F3CB8B; --brass-deep:#B8873F; --ink:#1E1403; --dim:#15303E;
  --teal:#57D9C9; --ok:#5BDCA8; --warn:#F2C14E; --bad:#F27C6C; --bad-dim:#3A1A18;
  --line:rgba(180,204,212,.16); --line-hi:rgba(180,204,212,.30);
  --glass:linear-gradient(180deg,rgba(22,58,76,.62),rgba(10,34,48,.70));
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 500px at 50% -120px,#0B2A3A 0%,transparent 70%),linear-gradient(180deg,#061A24,#020B11);
  color:var(--text);font:13.5px/1.42 var(--font);min-width:860px;min-height:600px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stars{position:fixed;inset:0 0 38% 0;pointer-events:none;opacity:.55}
#app{position:relative;height:100vh;min-height:600px;display:flex;flex-direction:column}
.col{width:100%;max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
h1,h2,h3{margin:0;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .okc{color:var(--ok)} .warnc{color:var(--warn)} .badc{color:var(--bad)} .brassc{color:var(--brass)}
.mono{font-family:var(--mono)}

/* prototype strip: clearly not part of the product */
#proto{flex:none;border-bottom:1px dashed rgba(228,178,106,.45);background:repeating-linear-gradient(135deg,rgba(228,178,106,.07) 0 10px,rgba(228,178,106,.03) 10px 20px)}
#proto .col{display:flex;align-items:center;gap:10px;height:34px;font-size:12px;color:var(--muted)}
#proto .tag{font-weight:700;letter-spacing:.08em;color:var(--brass);font-size:11px}
#proto label{display:flex;align-items:center;gap:6px}
#proto select{background:var(--input);border:1px solid var(--line-hi);border-radius:6px;padding:2px 6px;font-size:12px}
#proto .sp{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-hi);
  background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.btn:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:rgba(180,204,212,.45)}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--ink);border-color:var(--brass-deep);font-weight:600}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#F8D9A5,var(--brass-hi))}
.btn.danger{color:var(--bad);border-color:rgba(242,124,108,.45)}
.btn.danger:hover:not(:disabled){background:rgba(242,124,108,.12)}
.btn.danger-strong{background:var(--bad);color:#2B0905;border-color:#C9594A;font-weight:600}
.btn.danger-strong:hover:not(:disabled){background:#FF9282}
.btn.outline{border-color:var(--brass);color:var(--brass);background:transparent}
.btn.small{height:28px;padding:0 11px;font-size:12.5px}
.btn.big{height:38px;min-width:96px;padding:0 18px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.mock{border-style:dashed;border-color:rgba(228,178,106,.6);color:var(--brass-hi);background:transparent}
.linkish{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:rgba(91,220,168,.40);background:rgba(91,220,168,.08)}
.chip.warn{color:var(--warn);border-color:rgba(242,193,78,.40);background:rgba(242,193,78,.08)}
.chip.bad{color:var(--bad);border-color:rgba(242,124,108,.45);background:rgba(242,124,108,.10)}
.chip.teal{color:var(--teal);border-color:rgba(87,217,201,.40);background:rgba(87,217,201,.08);font-weight:500}
.chip.big{height:26px;font-size:13px;padding:0 11px}

/* letter badges instead of logos */
.badge{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  color:#06131A;background:hsl(var(--h,190) 62% 70%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.badge.sm{width:22px;height:22px;border-radius:6px;font-size:10px}
.badge.lg{width:44px;height:44px;border-radius:12px;font-size:16px}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.25)}

/* header */
header{flex:none}
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding-top:16px;padding-bottom:12px}
.mark{width:56px;height:56px;border-radius:15px;background:radial-gradient(circle at 50% 35%,#103447,#051923);border:1px solid rgba(228,178,106,.35);
  box-shadow:0 0 22px rgba(228,178,106,.18),inset 0 1px 0 rgba(255,255,255,.08);display:grid;place-items:center}
.mark svg{width:70%;height:70%}
.hdr-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title h1{font-size:22px;font-weight:300;letter-spacing:.01em}
.detail{color:var(--muted);margin-top:3px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lowest{font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-text{min-width:0}
.hdr-btns{display:flex;gap:8px;align-items:center}

/* update bar */
#upd .bar{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;margin-bottom:10px;border-radius:12px;
  background:rgba(228,178,106,.07);border:1px solid rgba(228,178,106,.28);font-size:12.5px}
#upd .bar p{flex:1;min-width:0}
#upd .bar .btns{display:flex;gap:8px;flex:none}

/* nav */
nav{flex:none}
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px}
.wsl{font-weight:700;font-size:12.5px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(4,18,28,.65)}
.seg button{height:30px;min-width:82px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;padding:0 14px}
.seg button:disabled{opacity:.45;cursor:default}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(228,178,106,.28),rgba(228,178,106,.16));color:var(--brass-hi);box-shadow:inset 0 0 0 1px rgba(228,178,106,.45)}
.pills{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(4,18,28,.65)}
.pills button{height:30px;padding:0 13px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.pills button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.pills button[aria-selected="true"]{background:rgba(87,217,201,.14);color:var(--text);box-shadow:inset 0 0 0 1px rgba(87,217,201,.40)}
.hint{color:var(--muted);font-size:12px;flex:1;min-width:180px}

/* main */
main{flex:1;min-height:0;overflow:auto;padding-bottom:20px}
main:focus-visible{outline:none}
.page-head{display:flex;align-items:flex-start;gap:10px 16px;margin:2px 0 12px;flex-wrap:wrap}
.page-head .t{flex:1 1 440px;min-width:0}
.page-head .actions{margin-left:auto}
.page-head h2{font-size:17px;font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:820px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar .note{margin:0}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{padding:14px 16px}
.card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.who h3{font-size:14.5px}
.email{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.card-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wins{margin-top:10px;display:grid;grid-template-columns:minmax(90px,140px) 1fr 330px;gap:6px 14px;align-items:center}
.wt{font-size:12.5px}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.meter i{display:block;height:100%;border-radius:999px}
.wl{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wl b{font-weight:600}
.reset{margin-top:12px;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(242,124,108,.16),rgba(58,26,24,.55));border:1px solid rgba(242,124,108,.40)}
.reset p{flex:1;font-size:12.5px}
.cnote{margin-top:10px;font-size:12.5px;color:var(--muted)}

/* tables */
.tablewrap{padding:4px 0;overflow:hidden}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:none;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 12px;border-bottom:1px solid rgba(180,204,212,.08);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr:hover td{background:rgba(255,255,255,.025)}
.cellflex{display:flex;align-items:center;gap:9px}
table.list td.right,table.list th.right{text-align:right}
.rowbtns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* lanes */
.presets{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.presets .lbl{font-weight:600}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px}
.lchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 7px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12.5px;white-space:nowrap}
.lchip .d{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#06131A}
.lchip.ok .d{background:var(--ok)} .lchip.cool .d{background:var(--warn)} .lchip.bad .d{background:var(--bad)}
.lchip.bad .n{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(242,124,108,.6)}
.sep{color:var(--faint);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}

/* switch */
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:1px solid var(--line-hi);background:rgba(255,255,255,.08);cursor:pointer;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .12s}
.switch[aria-checked="true"]{background:rgba(91,220,168,.30);border-color:rgba(91,220,168,.6)}
.switch[aria-checked="true"]::after{left:18px;background:var(--ok)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.swlabel{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}

.suggest{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:rgba(87,217,201,.07);border:1px solid rgba(87,217,201,.32)}
.suggest p{flex:1}

/* empty / not running */
.empty{padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-size:15px}
.empty p{color:var(--muted);max-width:520px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;margin-bottom:12px;border-radius:12px;background:rgba(242,124,108,.08);border:1px solid rgba(242,124,108,.35);font-size:12.5px}
.banner.warn{background:rgba(242,193,78,.07);border-color:rgba(242,193,78,.35)}
.banner p{flex:1}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(228,178,106,.25);border-top-color:var(--brass);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.marquee{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.marquee i{position:absolute;top:0;bottom:0;width:35%;border-radius:999px;background:linear-gradient(90deg,transparent,var(--brass),transparent);animation:mq 1.4s ease-in-out infinite}
@keyframes mq{from{left:-35%}to{left:100%}}
@media (prefers-reduced-motion:reduce){.spin,.marquee i{animation-duration:4s}}

/* log */
.log{background:var(--log);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:12px/1.55 var(--mono);color:#CFE3E8;white-space:pre;overflow:auto;height:calc(100vh - 360px);min-height:180px;margin:0}
.log .e{color:var(--bad)} .log .w{color:var(--warn)} .log .a{color:var(--brass-hi)}

/* footer */
footer{flex:none;border-top:1px solid var(--line);background:rgba(2,11,17,.6)}
footer .col{display:flex;align-items:center;gap:16px;height:36px;font-size:11.5px;color:var(--faint)}
footer .paths{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* dialogs */
dialog{padding:0;border:1px solid var(--line-hi);border-radius:16px;background:linear-gradient(180deg,#0E2C3C,#081D29);color:var(--text);
  width:min(560px,calc(100vw - 48px));max-height:calc(100vh - 48px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog.wide{width:min(680px,calc(100vw - 48px))}
dialog::backdrop{background:rgba(1,8,12,.62);backdrop-filter:blur(2px)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg-h{padding:18px 22px 6px;display:flex;align-items:center;gap:12px}
.dlg-h h2{font-size:16.5px}
.dlg-b{padding:8px 22px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.dlg-f .left{margin-right:auto;display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:12.5px}
.field input[type=text],.field input[type=password],.field select{height:34px;border-radius:9px;border:1px solid var(--line-hi);background:var(--input);padding:0 10px}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--brass-hi);outline-offset:1px}
.err{color:var(--bad);font-size:12.5px}
.danger-banner{padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,rgba(242,124,108,.22),rgba(58,26,24,.8));border:1px solid rgba(242,124,108,.55)}
.danger-banner strong{display:block;color:#FFB3A8;letter-spacing:.06em;margin-bottom:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;color:var(--text)}
.tile:hover{border-color:rgba(228,178,106,.55);background:rgba(228,178,106,.06)}
.tile b{display:block;font-size:14px;margin-bottom:2px}
.tile span.d{font-size:12px;color:var(--muted)}
.code{font:600 26px/1 var(--mono);letter-spacing:.12em;color:var(--brass-hi);padding:12px 14px;border-radius:10px;background:var(--input);border:1px solid var(--line);align-self:flex-start}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px}
.check .m{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#06131A}
.m.ok{background:var(--ok)} .m.todo{background:var(--brass)} .m.no{background:var(--bad)} .m.note{background:var(--warn)}
pre.out{margin:0;background:var(--log);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px/1.5 var(--mono);white-space:pre-wrap;max-height:260px;overflow:auto}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.radios input{margin-top:3px;accent-color:var(--bad)}
.mockline{font-size:12px;color:var(--brass-hi);border:1px dashed rgba(228,178,106,.5);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* toast */
#toast{position:fixed;right:20px;bottom:48px;z-index:5;max-width:420px;padding:10px 14px;border-radius:12px;background:#0F3142;border:1px solid var(--line-hi);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;display:none}
#toast.show{display:block}

/* menu-bar mock */
#menuMock{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none}
#menuMock::backdrop{background:rgba(1,8,12,.5)}
.mbar{height:28px;display:flex;align-items:center;gap:18px;padding:0 12px;background:rgba(32,40,46,.86);backdrop-filter:blur(20px);color:#EEF2F4;font-size:13px;border-bottom:1px solid rgba(0,0,0,.4)}
.mbar .app{font-weight:700}
.mbar .dimm{opacity:.85}
.mbar .sp{flex:1}
.mbar .item{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:5px;border:0;background:transparent;color:inherit;cursor:pointer}
.mbar .item[aria-expanded="true"]{background:rgba(255,255,255,.22)}
.mbar .glyph{position:relative;width:16px;height:16px}
.mbar .glyph i{position:absolute;right:-2px;bottom:-1px;width:7px;height:7px;border-radius:50%;border:1px solid rgba(32,40,46,1)}
.mmenu{position:absolute;top:30px;min-width:250px;padding:5px;border-radius:9px;background:rgba(42,50,56,.96);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 50px rgba(0,0,0,.55);color:#EEF2F4;font-size:13px}
.mmenu .hd{padding:4px 10px 4px 26px;color:#9DA8AE;font-size:12px}
.mmenu hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:5px 8px}
.mmenu [role=menuitem],.mmenu [role=menuitemcheckbox]{display:flex;width:100%;align-items:center;height:24px;padding:0 10px 0 26px;border-radius:5px;border:0;background:transparent;color:inherit;text-align:left;cursor:default;position:relative}
.mmenu [role=menuitem]:focus,.mmenu [role=menuitemcheckbox]:focus,.mmenu [role=menuitem]:hover:not([aria-disabled=true]),.mmenu [role=menuitemcheckbox]:hover{background:#2F6FD6;color:#fff;outline:none}
.mmenu [aria-disabled=true]{color:#7C878D}
.mmenu .ck{position:absolute;left:9px}
.mmenu .kbd{margin-left:auto;color:#9DA8AE;font-size:12px}
.mm-note{position:absolute;left:24px;bottom:24px;max-width:440px;padding:12px 14px;border-radius:12px;background:#0F3142;border:1px dashed rgba(228,178,106,.6);font-size:12.5px;color:var(--muted)}
.mm-note b{color:var(--brass-hi)}

/* quit screen */
.quit{height:100vh;display:grid;place-items:center;text-align:center}
.quit div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:460px}

/* short window (height < 760): tighter header like the Windows app */
@media (max-height:760px){
  .hdr{padding-top:10px;padding-bottom:8px;gap:12px}
  .mark{width:42px;height:42px;border-radius:12px}
  .hdr-title h1{font-size:18px}
  .navrow{padding-bottom:9px}
  .page-head{margin-bottom:9px}
  .hint{display:none}
  .card{padding:11px 14px}
  .log{height:calc(100vh - 300px)}
}
@media (max-width:1100px){

const pageHead = (title, note, actions = "") => `<div class="page-head"><div class="t"><h2 id="pageTitle">${esc(title)}</h2>${note ? `<p class="note">${note}</p>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
const badge = (o, cls = "") => `<span class="badge ${cls}" style="--h:${o.h}" aria-hidden="true">${esc(o.badge)}</span>`;
function notRunningPanel(what) {
  if (S.gw === "starting") return `<div class="glass empty"><div class="spin" aria-hidden="true"></div><h3>The gateway is starting.</h3><p>${esc(what)} are shown when it answers.</p></div>`;
  if (S.gw === "notanswering") return `<div class="glass empty"><h3>The gateway is not answering.</h3><p>${esc(what)} are shown again when it does. Stop asks before it cuts anything.</p></div>`;
  return `<div class="glass empty"><h3>The gateway is not running.</h3><p>Press Start to see ${esc(what.toLowerCase())}. The window keeps working without it; it only shows what it can read.</p>
    <button class="btn primary big" type="button" id="npStart">Start the gateway</button></div>`;
}
function notRunningBanner(text) {
  if (running()) return "";
  const cls = S.gw === "stopped" ? "" : "warn";
  return `<div class="banner ${cls}" role="note"><p>${esc(S.gw === "stopped" ? "The gateway is not running. " : S.gw === "starting" ? "The gateway is starting. " : "The gateway is not answering. ")}${esc(text)}</p>
    ${S.gw === "stopped" ? `<button class="btn primary small" type="button" id="nbStart">Start</button>` : ""}</div>`;
}

const FOCUSABLE = 'button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[href],[tabindex]:not([tabindex="-1"])';
const dlg = $("#dlg");
let D = null; // current dialog spec
function openDlg(spec) {

  (spec.buttons || []).forEach((b, i) => { const el = document.getElementById(b.id || "dlgb" + i); el.onclick = () => b.onClick ? b.onClick(el) : closeDlg(); });
  if (!dlg.open) dlg.showModal();

function closeDlg(reason) {

  const target = (spec && spec.openerId && document.getElementById(spec.openerId)) || (spec && spec.opener && document.contains(spec.opener) && spec.opener);
  if (target && !target.disabled) target.focus(); else $("#main").focus();
}
dlg.addEventListener("cancel", e => { e.preventDefault(); if (D && D.busy) return; closeDlg("escape"); });
function trap(container, e) {
  if (e.key !== "Tab") return;
  const f = [...container.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) { e.preventDefault(); return; }
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || !container.contains(document.activeElement))) { e.preventDefault(); last.focus(); }

}

  if (ok) { S.D.krea = { state: "signedin", until: new Date(Date.now() + 90 * 86400000) }; log("Signed in to Krea.", "a"); announce("Signed in to Krea"); }
  else { S.D.krea = { state: "none" }; log("Krea sign-in did not complete (KREA_REFUSED): consent was refused in the browser.", "e"); announce("Krea sign-in did not complete"); }
  S.D.vRead = new Date(); render(); later(30, () => $("#kSignIn") && !$("#kSignIn").disabled ? $("#kSignIn").focus() : $("#kSignOut").focus());
}

/* ---------- video route dialog ---------- */
function routeDialog(m, then) {
  openDlg({ title: "Video billing route", body: `<div class="field"><label for="rtSel">Charge ${esc(m.id)} to:</label><select id="rtSel">
      ${m.route ? "" : `<option value="" selected disabled>Choose a route…</option>`}${m.allowed.map(r => `<option value="${r}" ${r === m.route ? "selected" : ""}>${esc(VROUTES[r].label)} · ${r} · billed in ${esc(VROUTES[r].units)}</option>`).join("")}</select></div>
      <p class="muted" style="font-size:12.5px">One route for each model. A paid job is never retried automatically or moved to another route.</p>
      <p class="muted" style="font-size:12.5px">Saving a route does not check a sign-in, a key or a price, and charges nothing.${m.enabled || then ? "" : " The model stays switched off."}</p>`,
    buttons: [{ id: "rtCancel", label: "Cancel" }, { id: "rtSave", label: "Save route", kind: "primary", disabled: !m.route, onClick: () => {
      m.route = $("#rtSel").value; if (then) then();
      S.vStatus = `Saved: ${m.id} → ${m.route}, ${m.enabled ? "enabled" : "disabled"}. This is a setting only; nothing was checked or charged.`;
      log(`video settings set ${m.id.toUpperCase()} ${m.route.toUpperCase()} ${m.enabled ? "enabled" : "disabled"}`); closeDlg("ok");
    } }], focus: "#rtSel",
    onOpen: () => $("#rtSel").onchange = e => $("#rtSave").disabled = !e.target.value });
}

/* ---------- menu-bar mock ---------- */
const mm = $("#menuMock");
function openMenuMock() {
  const dot = { running: "var(--ok)", starting: "var(--warn)", notanswering: "var(--warn)", stopped: "var(--bad)" }[S.gw];
  const stateTxt = { running: "DSHProxy: running", starting: "DSHProxy: starting", notanswering: "DSHProxy: not answering", stopped: "DSHProxy: stopped" }[S.gw];
  const d = new Date();
  mm.innerHTML = `<div class="mbar"><span aria-hidden="true" style="font-size:15px"></span><span class="app">Safari</span><span class="dimm">File</span><span class="dimm">Edit</span><span class="dimm">View</span><span class="dimm">Window</span><span class="sp"></span>
    <span style="position:relative"><button type="button" class="item" id="mmItem" aria-haspopup="menu" aria-expanded="true" aria-controls="mmMenu" title="${esc(stateTxt)}">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1 L10 8 L8 15 L6 8 Z" fill="#EEF2F4"/><circle cx="8" cy="8" r="6.3" fill="none" stroke="#EEF2F4" stroke-width="1"/></svg><i style="background:${dot}"></i></span>
      <span class="sr">DSHProxy menu-bar item, ${esc(stateTxt)}</span></button>
      <div class="mmenu" id="mmMenu" role="menu" aria-label="DSHProxy" style="right:-150px">
        <div class="hd" aria-hidden="true">${esc(stateTxt)}</div><hr>
        <button type="button" role="menuitem" data-a="open" tabindex="-1">Open DSHProxy</button>
        <button type="button" role="menuitem" data-a="add" tabindex="-1">Add account…</button><hr>
        <button type="button" role="menuitem" data-a="start" tabindex="-1" aria-disabled="${S.gw !== "stopped"}">Start gateway</button>
        <button type="button" role="menuitem" data-a="stop" tabindex="-1" aria-disabled="${S.gw === "stopped"}">Stop gateway</button><hr>
        <button type="button" role="menuitemcheckbox" data-a="login" tabindex="-1" aria-checked="${S.loginItem}"><span class="ck" aria-hidden="true">${S.loginItem ? "✓" : ""}</span>Start at login</button><hr>
        <button type="button" role="menuitem" data-a="quit" tabindex="-1">Quit DSHProxy<span class="kbd" aria-hidden="true">⌘Q</span></button>
      </div></span>
    <span class="dimm" aria-hidden="true">◐</span><span class="dimm" aria-hidden="true">${DAYS[d.getDay()]} ${d.getDate()} ${MONS[d.getMonth()]} ${hm(d)}</span></div>
    <div class="mm-note"><b>Mock of the macOS menu bar.</b> The menu-bar item is the only native part of option (a). Its dot shows the gateway state. Use ↑ ↓ and Return, or click; Escape or a click outside closes it.
      <div style="margin-top:8px"><button type="button" class="btn small mock" id="mmClose">Close mock</button></div></div>`;
  mm.showModal();
  const items = () => [...mm.querySelectorAll("[role^=menuitem]")].filter(el => el.getAttribute("aria-disabled") !== "true");
  items()[0].focus();
  mm.querySelectorAll("[role^=menuitem]").forEach(el => el.onclick = () => menuAction(el));
  $("#mmClose").onclick = () => closeMenuMock();
  $("#mmItem").onclick = () => closeMenuMock();
  mm.onkeydown = e => {
    const list = items(), i = list.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = list.length; list[((i < 0 ? (e.key === "ArrowDown" ? -1 : 0) : i) + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home") { e.preventDefault(); list[0].focus(); } else if (e.key === "End") { e.preventDefault(); list[list.length - 1].focus(); }
    else trap(mm, e);
  };
}
mm.addEventListener("cancel", e => { e.preventDefault(); closeMenuMock(); });
mm.addEventListener("click", e => { if (e.target === mm) closeMenuMock(); });
function closeMenuMock(then) { if (mm.open) mm.close(); if (then) then(); else $("#pMenu").focus(); }
function menuAction(el) {
  if (el.getAttribute("aria-disabled") === "true") return;
  const a = el.dataset.a;
  if (a === "login") { S.loginItem = !S.loginItem; log(`Start at login: ${S.loginItem ? "on (login item added)" : "off (login item removed)"} (mock).`); render(); closeMenuMock(); toast(`Start at login is ${S.loginItem ? "on" : "off"}.`); return; }
  closeMenuMock(() => {
    if (a === "open") { toast("Open DSHProxy: brings this page to the front (a real build opens or focuses http://127.0.0.1:8418 in the default browser)."); $("#main").focus(); }
    if (a === "add") addAccount();
    if (a === "start") startGateway();
    if (a === "stop") stopGateway();
    if (a === "quit") {
      const cut = confirmCutText("Quit"), q = () => { log("Quitting DSHProxy."); S.quit = true; render(); };
      if (cut) confirmDlg({ title: "Quit DSHProxy", text: cut, ok: "Quit", kind: "danger-strong", onOk: q }); else q();
    }
  });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled || dlg.contains(b) || mm.contains(b)) return;
  const id = b.id || "";
  const acc = id.match(/^acc-(np|mp|pz|so|rs)-(.+)$/);
  if (acc) return accountAction(acc[1], S.D.accounts.find(a => a.id === acc[2]));
  let m;
  if (/^tab-\d$/.test(id)) { S.section = +id.slice(4); render(); return $("#tab-" + S.section).focus(); }
  if (id === "ws-chat" || id === "ws-video") return switchWs(id.slice(3));
  if ((m = id.match(/^key-(set|rm)-(.+)$/))) return keyAction(m[1], m[2]);
  if ((m = id.match(/^vkey-(set|rm)-(.+)$/))) return vkeyAction(m[1], m[2]);
  if ((m = id.match(/^pr-(.+)$/))) return presetAction(m[1]);
  if ((m = id.match(/^md-(.+)$/))) return modelToggle(m[1]);
  if ((m = id.match(/^vroute-(.+)$/))) return routeDialog(S.D.vmodels.find(x => x.id === m[1]));
  if ((m = id.match(/^vm-(.+)$/))) return vmodelToggle(S.D.vmodels.find(x => x.id === m[1]));
  const A = {
    hStart: startGateway, hStop: () => stopGateway(), npStart: startGateway, nbStart: startGateway, hApply: applyHarness,
    uUpdate: updateBackend, uRollback: rollbackBackend, pMenu: openMenuMock,
    fLogin: () => { S.loginItem = !S.loginItem; log(`Start at login: ${S.loginItem ? "on (login item added)" : "off (login item removed)"} (mock).`); render(); },
    accAdd: addAccount, accAdd2: addAccount,
    accRefresh: () => { S.limitsNote = "Reading limits..."; render(); later(700, () => { S.limitsNote = "Limits updated just now. They refresh every minute."; render(); }); },
    accFolder: () => toast("Would show ~/.dshproxy/auth in Finder (mock: nothing opened)."),
    logFolder: () => toast("Would show ~/.dshproxy in Finder (mock: nothing opened)."),
    lnEdit: () => confirmDlg({ title: "Lanes", icon: "info", text: "Opens settings.json in your text editor.\n\nPrototype: no editor opens. Continue to pretend the ladders were edited (the routing then shows as Custom).", ok: "Pretend edited", onOk: () => {
      S.D.lanes.main = ["claude-opus-5-5", "gpt-6-astra", "claude-fable-5-2", "deepseek/deepseek-v4-pro"]; S.D.preset = "custom"; log("settings.json changed: routing is now Custom."); render(); } }),
    mdHidden: () => { S.D.showHidden = !S.D.showHidden; render(); },
    mdCheck: () => { if (!needRunning("Models")) return; b.disabled = true; b.textContent = "Checking for new models..."; later(900, () => { S.D.modelsChecked = 0; log("Checked for new models; nothing new since the last check."); render(); toast("Checked for new models: nothing new."); }); },
    mdUse: useSuggestion, hvPreview: previewHarness, hvVerify: verifyHarness, hvRemove: removeHarness,
    hvToVideo: () => { S.ws = "video"; S.section = 4; render(); $("#tab-4").focus(); },
    kSignIn: kreaSignIn, kCancel: () => { S.D.krea = { state: "none" }; log("Krea sign-in cancelled: the helper was stopped."); render(); $("#kSignIn").focus(); },
    kMockOk: () => kreaFinish(true), kMockFail: () => kreaFinish(false),
    kSignOut: () => confirmDlg({ title: "Krea", text: "Sign out of Krea?\n\nThe Krea sign-in stored on this computer is removed. Video on the Krea workspace route then needs a new sign-in.", ok: "Sign out", kind: "danger-strong",
      onOk: () => { S.D.krea = { state: "none" }; log("Signed out of Krea."); render(); } }),
    vkToAcc: () => { S.section = 0; render(); $("#tab-0").focus(); },
    vlToModels: () => { S.section = 3; render(); $("#tab-3").focus(); },
    vReload: () => { S.vStatus = "Reading video settings..."; render(); later(500, () => { S.vStatus = null; S.D.vRead = new Date(); render(); }); },
  };
  if (A[id]) A[id]();
});
function switchWs(ws) { if (S.ws === ws) return; S.ws = ws; S.vStatus = null; if (ws === "video") S.D.vRead = new Date(); render(); $("#ws-" + ws).focus(); }
document.addEventListener("keydown", e => {
  const t = e.target; if (!t.id) return;
  if (/^tab-\d$/.test(t.id) && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault(); const i = +t.id.slice(4);
    S.section = e.key === "Home" ? 0 : e.key === "End" ? 5 : (i + (e.key === "ArrowRight" ? 1 : 5)) % 6; render(); $("#tab-" + S.section).focus();
  }
  if (/^ws-/.test(t.id) && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); switchWs(S.ws === "chat" ? "video" : "chat"); }
});
$("#pState").onchange = e => { clearTimeout(startTimer); setGw(e.target.value); };
$("#pData").onchange = e => { S.D = e.target.value === "empty" ? emptyData() : sampleData(); render(); };

function accountAction(kind, a) {
  if (!a) return; const s = SERVICES[a.provider], who = `${s.label} (${a.email})`;
  if (kind === "so") return confirmDlg({ title: "Sign out", text: `Sign out of ${who}?\n\nDSHProxy stops using this account and deletes its saved sign-in. Lanes move to their other models. You can sign in again at any time.`, ok: "Sign out", kind: "danger-strong",
    onOk: () => { S.D.accounts = S.D.accounts.filter(x => x !== a); log(`Signed out of ${who}.`); render(); toast(`Signed out of ${who}.`); $("#accAdd").focus(); } });
  if (kind === "pz") { a.disabled = !a.disabled; if (a.disabled) a.primary = false; log(`${a.disabled ? "Paused" : "Resumed"} ${who}.`); toast(`${a.disabled ? "Paused" : "Resumed"} ${who}.`); return render(); }
  if (kind === "mp") { S.D.accounts.forEach(x => { if (x.provider === a.provider) x.primary = x === a; }); log(`${who} is now the primary account: it is used until it runs out, then the other one takes over.`); toast(`${who} is now primary.`); render(); return $(`#acc-np-${a.id}`) && $(`#acc-np-${a.id}`).focus(); }
  if (kind === "np") { a.primary = false; log(`${s.label} has no primary account now: its accounts take turns.`); toast(`${s.label} accounts now take turns.`); return render(); }
  if (kind === "rs") return resetDialog(a);
}
function keyAction(kind, id) {
  const p = KEYPROV[id], k = S.D.keys[id];
  if (kind === "set") return keyDialog({ label: p.label, regions: p.regions, region: k.region, onSave: r => { k.state = "saved"; if (r) k.region = r; log(`key set ${id}${r ? " " + r : ""}: saved (encrypted).`); render(); restartQuestion(`Saved the ${p.label} key.`); } });
  confirmDlg({ title: "API key", text: `Remove the saved ${p.label} key?`, ok: "Remove", kind: "danger-strong", onOk: () => { k.state = "none"; log(`key remove ${id}: removed.`); render(); restartQuestion(`Removed the ${p.label} key.`); } });
}
function vkeyAction(kind, id) {
  const p = VKEYS[id], k = S.D.vkeys[id];
  if (kind === "set") return keyDialog({ label: p.label, video: true, onSave: () => { k.state = "saved"; log(`video key set ${id}: saved.`); render(); toast(`Saved the ${p.label} key. It was not checked against ${p.label}.`); } });
  confirmDlg({ title: "Video API key", text: `Remove the saved ${p.label} video key?\n\nDSHProxy's video command can then use ${p.label} only with a key in ${p.v}.`, ok: "Remove", kind: "danger-strong",
    onOk: () => { k.state = "none"; log(`video key remove ${id}: removed.`); render(); } });
}
function presetAction(name) {
  if (name === "custom" || name === S.D.preset) return;
  if (!needRunning("Routing preset")) return;
  const p = PRESETS[name];
  confirmDlg({ title: "Routing preset", icon: "ask", text: `Use the ${p.label} routing preset?\n\nThis replaces the ladders of all lanes. You can switch back or edit them at any time.`, ok: `Use ${p.label}`,
    onOk: () => { S.D.preset = name; S.D.lanes = clone(p.lanes); log(`Routing preset: ${p.label}.`); log("DeepSeek Harness routes updated. Restart DeepSeek Harness to see them."); render(); toast(`Routing preset: ${p.label}.`); $("#pr-" + name).focus(); } });
}
function modelToggle(id) {
  const m = S.D.models.find(x => x.id === id); if (!m) return;
  if (!needRunning("Models")) return;
  m.offered = !m.offered; m.reason = m.offered ? "user-on" : "user-off";
  log(`${m.offered ? "Offering" : "No longer offering"} ${id}; DeepSeek Harness routes updated. Restart DeepSeek Harness to see it.`);
  render(); announce(`${id} ${m.offered ? "offered" : "switched off"}`);
}
function useSuggestion() {
  const sg = S.D.suggestion, lanes = LANES.filter(l => (S.D.lanes[l] || []).includes(sg.from));
  confirmDlg({ title: "Lanes", icon: "ask", text: `Put ${sg.to} in place of ${sg.from} on lane ${lanes.join(", ")}?\n\nThe rest of each ladder stays as it is. You can change it back in settings.json.`, ok: `Use ${sg.to}`,
    onOk: () => { lanes.forEach(l => S.D.lanes[l] = S.D.lanes[l].map(x => x === sg.from ? sg.to : x)); S.D.preset = "custom"; S.D.suggestion = null;
      const m = S.D.models.find(x => x.id === sg.to); if (m) m.reason = "auto";
      log(`${sg.to} now replaces ${sg.from} on lane ${lanes.join(", ")}.`); render(); toast(`${sg.to} now replaces ${sg.from}.`); $("#mdCheck").focus(); } });
}
function vmodelToggle(m) {
  if (!m) return;
  const valid = m.route && m.allowed.includes(m.route);
  if (!m.enabled && !valid) return routeDialog(m, () => { m.enabled = true; });
  m.enabled = !m.enabled;
  S.vStatus = `Saved: ${m.id} ${m.enabled ? "enabled" : "disabled"}${m.route ? " on " + m.route : ""}. This is a setting only; nothing was checked or charged.`;
  log(`video settings set ${m.id.toUpperCase()} ${(m.enabled || valid ? m.route : "none").toUpperCase()} ${m.enabled ? "enabled" : "disabled"}`);
  render();
}
function previewHarness() {
  const lines = S.D.profiles.length ? S.D.profiles.map(p => p.points === "yes" ? `Profile ${p.name}: up to date, nothing to change.` : `Profile ${p.name}: would write 6 routes and ${S.D.models.filter(m => m.offered).length} models\n  + route dshproxy-main  → http://127.0.0.1:8417/v1 (model lane-main)\n  + route dshproxy-scout → http://127.0.0.1:8417/v1 (model lane-scout)\n  ~ default model: lane-main\n  (backup first; nothing else changes)`).join("\n\n")
    : "No DeepSeek Harness profile found. Open DeepSeek Harness once, then preview again.";
  msgDlg({ title: "Preview", icon: "info", body: `<p class="muted">dsh apply --dry-run (synthetic output):</p><pre class="out">${esc(lines)}</pre>` });
}
function verifyHarness() {
  const bad = S.D.profiles.filter(p => p.points !== "yes");
  const lines = S.D.profiles.length ? S.D.profiles.map(p => p.points === "yes" ? `✓ ${p.name}: routes, models, default model and credential match.` : p.points === "stale" ? `✗ ${p.name}: 2 routes point at an older model list. Apply again.` : `✗ ${p.name}: no DSHProxy routes.`).join("\n") : "✗ No DeepSeek Harness profile found.";
  log("dsh verify: " + (bad.length || !S.D.profiles.length ? "problems found" : "all profiles match"), bad.length ? "w" : "");
  msgDlg({ title: "Verify DeepSeek Harness", icon: bad.length || !S.D.profiles.length ? "warn" : "ok", body: `<pre class="out">${esc(lines)}</pre>${bad.length ? `<p class="muted">Press Apply to DeepSeek Harness at the top to fix it.</p>` : ""}` });
}
function removeHarness() {
  confirmDlg({ title: "DeepSeek Harness", text: "Remove the DSHProxy routes from every DeepSeek Harness profile?", ok: "Remove routes", kind: "danger-strong",
    onOk: () => { S.D.profiles.forEach(p => p.points = "none"); log("dsh remove: DSHProxy routes removed from every profile."); render();
      msgDlg({ title: "DeepSeek Harness", icon: "info", body: `<pre class="out">${esc(S.D.profiles.map(p => `Profile ${p.name}: DSHProxy routes removed (backup kept).`).join("\n"))}</pre><p class="muted">Restart DeepSeek Harness to see the change.</p>` }); } });
}
function updateBackend() {
  const b = S.backend, v = b.latest;
  confirmDlg({ title: "Update CLIProxyAPI", icon: "ask", ok: "Update", text: `Update the backend to CLIProxyAPI ${v}?\n\n1. Download it and check it against the release's published checksum.\n2. Start it on a spare port and send one short request through each signed-in account (uses a tiny bit of quota).\n3. Only if that passes: restart DSHProxy on ${v}, about 5 seconds offline.\n\nIf anything fails, DSHProxy stays on the version you have.`,
    onOk: () => {
      b.busy = true; render(); log(`Downloading CLIProxyAPI ${v}...`, "a");
      later(2200, () => {
        const checks = S.D.accounts.filter(a => !a.disabled).map(a => `• ${svcLabel(a.provider)} (${a.email}): answered`);
        b.busy = false; b.previous = b.current; b.current = v; b.latest = null;
        log(`CLIProxyAPI ${v}: trial run passed; restarting.`, "a");
        msgDlg({ title: "Update CLIProxyAPI", icon: "ok", text: `CLIProxyAPI ${v} passed its trial run.\n\nTrial run:\n${checks.join("\n") || "• no signed-in account to try"}\n\nDSHProxy is restarting on the new version.` });
        S.gw = "starting"; $("#pState").value = "starting"; render(); later(1500, () => { if (S.gw === "starting") setGw("running"); });
      });
    } });
}
function rollbackBackend() {
  const b = S.backend;
  confirmDlg({ title: "Roll back", icon: "ask", ok: "Roll back", text: `Go back to CLIProxyAPI ${b.previous}?\n\nDSHProxy restarts, about 5 seconds offline.`,
    onOk: () => { log(`Rolled back to CLIProxyAPI ${b.previous}.`); b.latest = b.current; b.current = b.previous; b.previous = null; setGw("starting"); later(1500, () => { if (S.gw === "starting") setGw("running"); }); } });
}

/* ---------- stars backdrop (seeded, like the Windows skin) ---------- */
function stars() {
  const c = $("#stars"), w = c.width = innerWidth, h = c.height = Math.round(innerHeight * 0.62), x = c.getContext("2d");
  let s = 1846; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 150; i++) { x.globalAlpha = 0.25 + r() * 0.6; x.fillStyle = r() < 0.15 ? "#F3CB8B" : "#CFE3E8"; x.beginPath(); x.arc(r() * w, r() * h, r() * 1.1 + 0.2, 0, 7); x.fill(); }
}
addEventListener("resize", stars); stars();
render();
</script>
