name: CI

on:
  push:
    branches: [main, macos-port]
  pull_request:

permissions:
  contents: read

jobs:
  # A secret scan of the commits being pushed or proposed (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      # A commit's author address is public forever. Only GitHub's no-reply
      # address may appear, so a private address is never published by a merge
      # or a push. (Set "Keep my email addresses private" on GitHub too.)
      - name: Commit authors carry no private address
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${base:-}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          allowed='^(noreply@github\.com|[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com)$'
          bad=""
          while read -r sha; do
            [ -n "$sha" ] || continue
            subject=$(git log -1 --format=%s "$sha")
            for address in "$(git log -1 --format=%ae "$sha")" "$(git log -1 --format=%ce "$sha")"; do
              printf '%s' "$address" | grep -qE "$allowed" && continue
              if printf '%s' "$subject" | grep -qE '^Merge [0-9a-f]{40} into [0-9a-f]{40}$'; then
                echo "::warning::GitHub's test-merge commit $sha carries a private address. Turn on \"Keep my email addresses private\" on GitHub; until then every pull request publishes it."
              else
                bad="$bad${bad:+, }$address ($sha)"
              fi
            done
          done < <(git rev-list "$base..HEAD")
          if [ -n "$bad" ]; then
            echo "These commit author or committer addresses must not be published: $bad"
            echo "Amend them to <id>+<login>@users.noreply.github.com, then push again."
            exit 1
          fi
          echo "ok: no private address in the commits of $base..HEAD"

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      # Actions are pinned to a commit, not a tag that can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node scripts/check.js
      - name: Compile the Windows desktop app
        shell: powershell
        run: .\app\build.ps1
      # A checkout of main beside this one, for the test that reads each
      # other's data folders (docs/work/0014-macos-port, C13).
      - name: Check out main for the compatibility test
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add ../dshproxy-main FETCH_HEAD
          cd ../dshproxy-main && npm ci --ignore-scripts
      - name: node --test
        shell: bash
        env:
          DSHPROXY_BASE_CHECKOUT: ${{ github.workspace }}/../dshproxy-main
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-results.tap
      # Windows runs at least the 914 tests it ran before the macOS port, and
      # all of them pass (C1).
      - name: At least 914 tests pass, none fails
        shell: bash
        run: |
          pass=$(grep -E '^# pass ' test-results.tap | awk '{print $3}')
          fail=$(grep -E '^# fail ' test-results.tap | awk '{print $3}')
          echo "pass $pass, fail $fail"
          test "$fail" -eq 0 && test "$pass" -ge 914

  test-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, and Intel while GitHub still offers it.
        os: [macos-latest, macos-15-intel]
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node scripts/check.js
      # On CI the tests that lock a throwaway keychain run as well.
      - run: node --test
      # The tests use throwaway keychains only: the machine's own login
      # keychain has no DSHProxy item afterwards (exit 44: not found).
      - name: The login keychain was not touched
        run: |
          set +e
          security find-generic-password -s DSHProxy -a key-wrapper > /dev/null 2>&1
          code=$?
          echo "security exit $code"
          test "$code" -eq 44
      # Downloads the pinned backend, starts it, stops it (C2).
      - run: node scripts/start-stop-check.js
      # The macOS app (stage D): its non-UI part is checked, and the app is built.
      - run: swift run --package-path app-macos KitChecks
      - run: app-macos/build.sh
