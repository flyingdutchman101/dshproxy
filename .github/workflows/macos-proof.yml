# Throwaway, for docs/work/0012-macos-port: shows on a real Mac what the spec
# assumes about the Keychain, the backend and file modes. Runs only for pushes
# to the macos-port branch that touch the proof. Removed before that branch is
# merged.
name: macOS proof (0012, throwaway)

on:
  push:
    branches: [macos-port]
    paths:
      - docs/work/0012-macos-port/spike/**
      - .github/workflows/macos-proof.yml

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, and Intel while GitHub still offers it.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag that can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci --ignore-scripts --force
      - run: node docs/work/0012-macos-port/spike/proof.js
